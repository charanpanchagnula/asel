[project]
name = "asel"
version = "0.1.0"
description = "Autonomous Security Execution Lab"
requires-python = ">=3.11"
dependencies = [
    "agno>=1.3.0",
    "docker>=7.0.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "openai>=2.30.0",
]

[project.scripts]
asel = "asel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[tool.ruff]
line-length = 100
